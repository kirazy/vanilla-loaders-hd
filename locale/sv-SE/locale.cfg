[mod-setting-description]
vanillaLoaders-recipes-loaderOverhaul=Ersätter lastarrecepten med helt omarbetade recept. När ”Transport belt overhaul” i Bob's Logistics är aktiverat anpassas recepten till Bob's moddar. Inaktivera för att använda grundspelets recept. Se moddens sida för mer information.\n\n[color=#9cdcfe]Standard:[/color] [color=green]Aktiverat[/color]
vanillaLoaders-recipes-includeInserters=Lägger till lastkranar i lastarrecepten. Kräver att ”Omarbetade recept” och ”Transport belt overhaul” i Bob's Logistics är aktiverade.\n\n[color=#9cdcfe]Standard:[/color] [color=green]Aktiverat[/color]
vanillaLoaders-do-loader-snapping=När detta är aktiverat snäpper lastare till närliggande anslutningsbara objekt när de placeras.\n\n[color=#9cdcfe]Standard:[/color] [color=green]Aktiverat[/color]
vanilla-loaders-enable-loader-belt-stacking=När detta är aktiverat staplar lastare föremål på transportband på samma sätt som stapellastkranar.\n\n[color=#9cdcfe]Standard:[/color] [color=green]Aktiverat[/color]

